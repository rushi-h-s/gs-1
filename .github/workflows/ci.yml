name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # types + lint + unit/property/fuzz tests. The end-to-end suites need a Supabase project
      # and are run locally (`npm run test:e2e`) or in a separate job with secrets.
      - run: npm run check
