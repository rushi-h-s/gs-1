name: keepalive
# Free Render sleeps after ~15 min idle and free Supabase pauses after ~7 days idle.
# Pinging /api/health (which makes one tiny DB query) keeps both awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}   # repo Settings > Variables > Actions, e.g. https://filewise-gst.onrender.com
        run: |
          [ -n "$APP_URL" ] || { echo "Set the APP_URL repository variable"; exit 1; }
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$APP_URL/api/health"
